<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Obrigado! • Diagnóstico Femo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-[#f3edd8] flex items-center justify-center min-h-screen text-[#1a110b]">
    <div class="bg-white p-10 rounded-2xl shadow-xl text-center max-w-lg mx-auto">
        <h1 id="thank-you-heading" class="text-4xl font-bold text-green-600 mb-4">Diagnóstico Enviado!</h1>
        <p class="text-gray-700 text-lg">Obrigado por preencher o formulário. Uma cópia do seu diagnóstico foi enviada para o seu e-mail.</p>
        <p class="text-gray-600 mt-4">Nossa equipe de especialistas analisará seus resultados e entrará em contato em breve com direcionamentos estratégicos.</p>
        <a href="/" class="mt-8 inline-block bg-[#f1b302] text-[#1a110b] font-bold py-3 px-8 rounded-lg shadow-lg hover:bg-opacity-90 transition-all">Voltar ao Início</a>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const name = urlParams.get('name');
            if (name) {
                const heading = document.getElementById('thank-you-heading');
                heading.textContent = `Obrigado, ${decodeURIComponent(name)}!`;
            }
        });
    </script>
</body>
</html>
